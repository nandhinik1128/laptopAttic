<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sclick()">Check price</button>
    <p id="display"></p>
</body>
<script>
    function sclick(){
        let price=1000;
        if(price>=100){
            document.getElementById("display").innerText="It is expensive";
        }
        else{
            document.getElementById("display").innerText="It is cheap";
        }
    }
</script>
</html>
