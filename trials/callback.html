<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="Show()">Show Task</button>
    <p id="display"></p>
</body>
<script>
    function Show(){
        document.getElementById("display").innerText="Task started....."
        setTimeout(function(){
            finishedtask("Task Completed!!")
        },2000);
        function finishedtask(message){
document.getElementById("display").innerText=message;
        }
    }
</script>
</html>
